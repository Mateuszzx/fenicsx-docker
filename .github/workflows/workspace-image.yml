name: Workspace image

# Publishes ghcr.io/mateuszzx/fenicsx-workspace from this repository.
# Project templates do not include this workflow.
on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
    paths:
      - "image/**"
      - ".github/workflows/workspace-image.yml"
  workflow_dispatch:
  schedule:
    # Rebuild weekly so :latest tracks dolfinx/dolfinx:nightly.
    - cron: "0 4 * * 1"

concurrency:
  group: workspace-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish workspace image
    if: github.repository == 'Mateuszzx/fenicsx-docker'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fenicsx-workspace" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
