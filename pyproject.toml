[project]
name = "fenicsx-template"
version = "0.1.0"
description = "FEniCSx project template with uv, just, and the DOLFINx nightly image."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
# Runtime packages installed by uv.
# DOLFINx, Basix, UFL, FFCx, PETSc, and mpi4py come from
# dolfinx/dolfinx:nightly. Do not add fenics-dolfinx here: a PyPI wheel
# would hide the image build.
dependencies = []

[project.scripts]
poisson = "fenicsx_template.poisson:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fenicsx_template"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "mpi", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
mpi = ["mpi4py", "petsc4py"]
